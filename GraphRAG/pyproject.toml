[project]
name = "graphrag"
version = "0.1.0"
description = "PDF Knowledge Graph Builder with Neo4j"
readme = "README.md"
authors = [
    { name = "arpangreat", email = "arpanthegreat41@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.22.0",
    "neo4j>=6.3.0",
    "networkx>=3.6.1",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
]

[project.scripts]
graphrag = "graphrag.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
